<title>ViCC 実写・アニメーション上映会</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4efe6;--card:#ffffff;--tx:#1f1b18;--sub:#5c554e;--ac:#b3261e;--ac2:#c58b00;--bd:#ddd3c3;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;margin:8px 0 2px}h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--sub);font-size:13px;margin:0 0 12px}
nav{display:flex;gap:6px;margin:12px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:2}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;font-size:13px;font-weight:700;cursor:pointer}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:16px;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:6px;font-size:16px;cursor:pointer}
.opt:active,.opt:hover{border-color:var(--ac)}
.btn{padding:12px 18px;border:0;border-radius:6px;background:var(--ac);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.btn.g{background:var(--bd);color:var(--tx)}
.big{font-size:44px}
.bar{height:8px;background:var(--bd);border-radius:4px;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--ac2);border-radius:4px}
select,input,textarea{width:100%;padding:10px;border:2px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit;margin:4px 0 10px}
.stars button{background:none;border:0;cursor:pointer;opacity:.35;padding:2px 4px}
.stars button.on{opacity:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.row:last-child{border:0}
.stamps{display:flex;gap:10px;justify-content:center;margin:12px 0}
.st{width:84px;height:84px;border-radius:50%;border:3px dashed var(--bd);display:flex;align-items:center;justify-content:center;font-size:34px;flex-direction:column}
.st.on{border:3px solid var(--ac2);background:rgba(197,139,0,.15)}
.st small{font-size:10px;color:var(--sub)}
.win{text-align:center;padding:16px;border-radius:6px;background:var(--ac2);color:#2b2233;font-weight:800}
.cm{font-size:14px;color:var(--sub)}
svg.lucide{width:1.1em;height:1.1em;vertical-align:-.17em}
.big svg{width:56px;height:56px;color:var(--ac)}
.stars svg{width:32px;height:32px}.stars button{color:var(--sub)}
.stars button.on svg{fill:var(--ac2);stroke:var(--ac2)}
.emo{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.emo button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border:2px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--sub);font-size:11px;cursor:pointer;opacity:1}
.emo button.on{border-color:var(--ac);color:var(--ac)}.emo svg{width:24px;height:24px}
.st{color:var(--sub)}.st.on{color:var(--ac)}.st svg{width:32px;height:32px}
h1 svg{color:var(--ac);width:1.2em;height:1.2em}
nav button{font-size:11px}
.tg{display:flex;gap:8px}.tg button{flex:1;padding:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:6px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.tg button.on{background:var(--ac);border-color:var(--ac);color:#fff}.tg small{font-weight:400;font-size:11px}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}details.card[open]>summary{margin-bottom:8px}
.strip{height:10px;margin:4px 0 12px;background:repeating-linear-gradient(90deg,var(--tx) 0 14px,transparent 14px 24px);border-radius:2px}
h1{margin:0 0 4px;display:flex;flex-direction:column;line-height:1.1}
.lg{font-family:'Oswald','Arial Narrow',sans-serif;font-size:56px;letter-spacing:.12em;font-weight:400}
.tl{font-family:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;font-size:18px;letter-spacing:.15em;color:var(--sub)}
h2{font-family:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;letter-spacing:.06em}
summary b{font-family:'Oswald','Arial Narrow',sans-serif;font-size:26px;font-weight:400;letter-spacing:.06em;margin-right:6px}
.st.on{color:var(--ac2)}
.fm{border-top:1px dashed var(--bd);padding:8px 0}.fm summary{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fm[open]>summary{margin-bottom:6px}
.chev{flex:none;color:var(--sub);transition:transform .2s}.fm[open] .chev{transform:rotate(180deg)}
.ds{white-space:pre-line;font-size:14px;color:var(--sub)}.ds p{margin:6px 0 2px;color:var(--tx)}
.tag{display:inline-block;border:1px solid var(--bd);border-radius:3px;padding:0 6px;font-size:11px;margin:0 4px 2px 0;color:var(--sub)}
body{font-size:16px}.sub{font-size:14px}.cm{font-size:14px}
.card{box-shadow:0 1px 3px rgba(0,0,0,.07)}
.hd{background:#1f1b18;border-radius:6px;padding:12px 16px 16px}
.hd .strip{background:repeating-linear-gradient(90deg,#f4efe6 0 14px,transparent 14px 24px)}
.lg{color:#f4efe6;font-weight:600;text-transform:none}.tl{color:#e5b84b}
summary b{font-weight:600;color:var(--pc,var(--ac))}
.chip{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--pc,var(--ac));color:#fff;vertical-align:middle;margin-right:2px}
.chip svg{width:16px;height:16px;vertical-align:0}
.fm svg.lucide{color:var(--pc,var(--ac))}.fm .chev{color:var(--sub)}
.ds{font-size:15px;color:var(--tx)}.ds p{color:var(--tx);line-height:1.8}
.tag{color:var(--ac);border-color:var(--ac);background:#fff;font-size:12px}
nav button{font-size:12px}
.note{background:#fff4d6;border:1px solid #e5c76b;border-radius:6px;padding:10px 12px;margin:0 0 10px;font-size:14px;color:var(--tx)}
.tag.new{color:#1f7a6d;border-color:#1f7a6d}
.dt{color:#f4efe6;font-size:14px;letter-spacing:.08em;margin-top:6px}
.ft{font-weight:700;margin-right:6px;color:var(--pc,var(--ac))}
.ov{position:fixed;inset:0;background:rgba(31,27,24,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fi .25s}
.th{position:relative;overflow:hidden;background:#fff;border-radius:8px;padding:20px 20px 24px;text-align:center;max-width:340px;width:100%}
.th img{width:180px;height:auto;display:block;margin:0 auto}.th h2{margin:6px 0}
.nt{position:absolute;bottom:90px;color:var(--ac);opacity:0;animation:fl 2.4s infinite}
@keyframes fl{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(-130px);opacity:0}}
@keyframes fi{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.nt{display:none}}
.pill{display:inline-block;background:var(--pc);color:#fff;border-radius:3px;padding:1px 8px;font-size:11px;font-weight:700;margin-bottom:3px}
.mt{font-size:17px;font-weight:700;line-height:1.35}
.mh{flex:1;display:flex;justify-content:space-between;align-items:center;gap:10px}
.mc{display:flex;align-items:center;gap:12px;border:2px solid var(--pc)}
.rn{font-family:'Oswald','Arial Narrow',sans-serif;font-size:34px;font-weight:600;color:var(--pc);min-width:32px;text-align:center}
.sc{text-align:right;white-space:nowrap}.sc b{font-family:'Oswald','Arial Narrow',sans-serif;font-size:24px;font-weight:600;display:block;line-height:1.1}
.stv{display:inline-flex;gap:1px}.stv svg{width:14px;height:14px;fill:var(--ac2);stroke:var(--ac2)}.stv .off svg{fill:none;stroke:var(--bd)}
.gh{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-size:16px}.gh .chip{background:var(--pc)}
.fc{border:2px solid var(--pc);border-radius:6px;background:#fff;margin-bottom:12px;overflow:hidden}
.fh{padding:12px;background:#fff;border-bottom:2px solid var(--pc)}
.fb{padding:10px 12px}
.rv{border:1px solid var(--bd);border-radius:4px;padding:8px 10px;margin-bottom:8px;background:var(--bg)}
.rv p{margin:4px 0;white-space:pre-wrap}.rt{display:flex;align-items:center;gap:8px}
.rx{font-size:12px;color:var(--sub);border:1px solid var(--bd);border-radius:3px;padding:0 6px;background:#fff}
.em{margin:4px 0 10px}
.btn.sm{padding:6px 10px;font-size:13px}
nav button span{word-break:keep-all;text-align:center;line-height:1.25}
.ct{margin:6px 0;font-size:15px;white-space:pre-wrap}
.tp{border:2px solid var(--tx);margin-top:20px}.tp h3{margin:0 0 8px;font-size:17px;color:var(--tx);display:flex;align-items:center;gap:6px}
.rk{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:15px;border-top:1px dashed var(--bd)}.rn2{font-family:'Oswald','Arial Narrow',sans-serif;font-size:22px;font-weight:600;color:var(--ac);width:24px;text-align:center}.rk-t{flex:1;font-weight:700}
.rk svg{width:12px;height:12px;fill:var(--ac2);stroke:var(--ac2)}
.cel{text-align:center}
.mq{overflow:hidden;white-space:nowrap;background:#1f1b18;color:#f4efe6;border-radius:6px;padding:10px 0;font-weight:700;font-size:17px;margin-bottom:8px}
.mq span{display:inline-block;padding-left:100%;animation:mq 15s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.cel img{width:230px;max-width:80%;height:auto;display:block;margin:0 auto}
@media (prefers-reduced-motion:reduce){.mq{white-space:normal;padding:10px}.mq span{animation:none;padding:0}}
.stamps{gap:8px;flex-wrap:wrap}.st{width:68px;height:68px}.st svg{width:26px;height:26px}
.scr{position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#2a2420 0%,#0b0908 75%);border-radius:4px;min-height:190px;display:flex;align-items:center;justify-content:center;padding:46px 16px;margin-bottom:10px}
.bar{position:absolute;left:0;right:0;height:26px;background:#000}
.bar.t{top:0;border-bottom:1px solid #c58b00}.bar.b{bottom:0;border-top:1px solid #c58b00}
.tt{text-align:center;display:flex;flex-direction:column;gap:10px}
.l1,.l2,.l3{display:block;opacity:0;filter:blur(8px);letter-spacing:.3em;animation:ti2 .6s ease-out both;text-wrap:balance}
.l1{font-family:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;font-size:17px;color:#f4efe6}
.l2{font-family:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;font-size:19px;color:#e5b84b;animation-delay:.45s}
.l3{font-family:'Oswald','Arial Narrow',sans-serif;font-size:11px;color:#9a9188;animation-delay:.9s}
@keyframes ti{0%{opacity:0;filter:blur(8px);letter-spacing:.36em}14%{opacity:1;filter:blur(0);letter-spacing:.08em}80%{opacity:1;filter:blur(0);letter-spacing:.08em}94%,100%{opacity:0;filter:blur(4px);letter-spacing:.08em}}
@keyframes ti2{to{opacity:1;filter:blur(0);letter-spacing:.08em}}
.ct2{font-size:18px;font-weight:700;line-height:1.6;margin:0 0 12px;color:var(--tx)}
@media (prefers-reduced-motion:reduce){.l1,.l2,.l3{animation:none;opacity:1;filter:none;letter-spacing:.08em}.scr{animation:none}}
img{max-width:100%}
.mt,.ct,.rk-t,.rv p,.ds{overflow-wrap:anywhere}
@media (min-width:720px){main{max-width:720px;padding:24px 24px 56px}.lg{font-size:72px}nav button{font-size:14px}.mt{font-size:19px}}
@media (max-width:360px){.lg{font-size:44px}.tl{font-size:15px}nav button{font-size:10px;padding:8px 0}.st{width:58px;height:58px}.btn{padding:10px 14px;font-size:15px}.mt{font-size:16px}}
.syn{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
</style>

 D.p.split('').map((k,si)=>{const p=PR[k],t0=(10+si)*60;let t=t0;return `<details class="card" style="--pc:${p.c}"><summary><b>${hm(t0)}</b> <span class="chip">${I(p.e)}</span> ${p.n} <span class="cm">${Math.round(dur(k))}分</span><br><span class="cm">${p.s}</span></summary>${p.w?`<p class="cm">${I('triangle-alert')} ${p.w}</p>`:''}${p.f.map(j=>{const m=MOVIES[j],st=t;t+=m.m;return `<details class="fm"><summary><span><span class="ft">${hm(st)}</span>${esc(m.n)}<br><span class="cm">${esc(m.by)}${m.by.startsWith('Team')?'（新入部員）':''}・${dm(m.m)}${TBD[j]?'（'+TBD[j]+'）':''}</span></span><i data-lucide="chevron-down" class="chev"></i></summary><div class="ds">${m.by.startsWith('Team')?`<span class="tag new">${I('sprout')} 今年度入会の新メンバーの作品</span>`:''}${m.g?m.g.split('、').map(x=>`<span class="tag">${esc(x)}</span>`).join(''):''}${m.d?`<p>${esc(m.d)}</p>`:''}</div></details>`}).join('')}</details>`}).join('');
 $('v').querySelectorAll('.tg button').forEach(b=>b.onclick=()=>{day=+b.dataset.d;render()})}
const QS=[
{q:'今日の気分は？',o:[['ゾクゾクしたい','h'],['じっくり浸りたい','d'],['知らない世界をのぞきたい','w'],['ほっこり笑いたい','f']]},
{q:'好きなジャンルは？',o:[['ホラー・ミステリー','h'],['青春・恋愛もの','d'],['ルポ・旅行記','w'],['ギャグ・アニメ','f']]},
{q:'友達との話題といえば？',o:[['怖い・不思議な体験談','h'],['悩みや恋バナ','d'],['世界のニュース','w'],['笑える失敗談','f']]},
{q:'観終わったあと、どうなりたい？',o:[['背筋を凍らせたい','h'],['余韻に浸りたい','d'],['世界の見え方を変えたい','w'],['元気になりたい','f']]}
];
const EMO=[['droplets','泣けた'],['laugh','笑えた'],['heart-pulse','ドキドキ'],['sparkles','ワクワク'],['heart','好き']];
const EL=Object.assign(Object.create(null),Object.fromEntries(EMO)),I=n=>`<i data-lucide="${n}"></i>`;
const K='cinema-compass-v1';
let S={reviews:[],quiz:false},tab='sch',qi=0,tally={h:0,d:0,w:0,f:0},res=null,draft={m:0,s:0,e:'',t:'',nm:''};
try{const r=JSON.parse(localStorage.getItem(K)||'{}');
 if(r&&typeof r==='object'){
  if(Array.isArray(r.reviews))S.reviews=r.reviews.filter(x=>x&&typeof x.m==='string'&&Number.isFinite(+x.s)).slice(0,500).map(x=>({id:typeof x.id==='string'?x.id.replace(/[^a-z0-9]/gi,'').slice(0,30):'',sy:x.sy?1:0,m:x.m.slice(0,80),s:Math.min(5,Math.max(1,Math.round(+x.s))),e:typeof x.e==='string'?x.e.slice(0,20):'',t:typeof x.t==='string'?x.t.slice(0,120):'',nm:typeof x.nm==='string'?x.nm.slice(0,12):'匿名',at:+x.at||0,sid:+x.sid||1}));
  S.quiz=!!r.quiz;if(typeof r.pc==='string')S.pc=r.pc.slice(0,30);S.sid=Math.max(1,Math.round(+r.sid)||1);if(typeof r.dev==='string')S.dev=r.dev.replace(/[^a-z0-9]/gi,'').slice(0,30);
 }}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const TABS=[['sch','calendar-clock','上映日程'],['quiz','compass','診断'],['rev','pen-line','感想'],['rank','messages-square','みんなの<wbr>コメント'],['stamp','ticket','スタンプ']];
function nav(){$('nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-t="${t[0]}">${I(t[1])}<span>${t[2]}</span></button>`).join('');
$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();if(tab==='rank')loadRemote()})}
function thanks(done){
 const o=document.createElement('div');o.className='ov';
 o.innerHTML=`<div class="th"><span class="nt" style="left:12%"><i data-lucide="music"></i></span><span class="nt" style="left:82%;animation-delay:.8s"><i data-lucide="music-2"></i></span><span class="nt" style="left:62%;animation-delay:1.5s"><i data-lucide="music"></i></span>${done?celeb():`<img id="ant" alt="" src="${FR[0]}"><h2>感想ありがとう！</h2><p class="cm">あなたの感想が、次に観る人の道しるべになります。</p>`}<button class="btn" id="thx">とじる</button></div>`;
 document.body.appendChild(o);if(done)startLoop();
 try{lucide.createIcons()}catch(e){}
 const im=o.querySelector('#ant');let i=0,dir=1,tm=0;
 if(im&&!matchMedia('(prefers-reduced-motion:reduce)').matches){tm=setInterval(()=>{i+=dir;if(i>=FR.length-1||i<=0)dir=-dir;im.src=FR[i]},90)}
 o.onclick=e=>{if(e.target===o||e.target.id==='thx'){clearInterval(tm);o.remove()}};
}
function render(){nav();({sch:vSch,quiz:vQuiz,rev:vRev,rank:vRank,stamp:vStamp})[tab]();try{lucide.createIcons()}catch(e){}startLoop()}
function vQuiz(){
 if(!ok){$('v').innerHTML=`<div class="card"><h2>${I('triangle-alert')} 診断を始める前に</h2><p>この診断機能は、あなたにぴったりの作品を紹介する機能です。<br>ただし、この機能の性質上、作品のネタバレを含む場合があります。</p><button class="btn" id="agree">了解して診断する</button> <button class="btn g" id="bk">上映日程にもどる</button></div>`;$('agree').onclick=()=>{ok=true;render()};$('bk').onclick=()=>{tab='sch';render()};return}
 if(res){const[a,b]=res;$('v').innerHTML=`<div class="card" style="text-align:center"><p class="sub">あなたにぴったりの映画は…</p><h2>${esc(a.n)}</h2><p class="ds">${esc(a.d)}</p><p class="cm">${dm(a.m)} ／ ${esc(a.by)}${a.by.startsWith('Team')?'（今年度入会の新メンバーの作品）':''}<br>上映の目安：${when(MOVIES.indexOf(a))}<br>観たいときは会場の部員に声をかけてね</p><p class="cm">2番手のおすすめ：${esc(b.n)}</p><button class="btn" id="go">${I('pen-line')} 観終わったら感想を書く</button> <button class="btn g" id="re">${I('rotate-ccw')} もう一度</button></div>`;
  $('go').onclick=()=>{draft.m=MOVIES.indexOf(a);tab='rev';render()};$('re').onclick=()=>{res=null;qi=0;tally={h:0,d:0,w:0,f:0};render()};return}
 const q=QS[qi];
 $('v').innerHTML=`<div class="card"><div class="bar"><i style="width:${qi/QS.length*100}%"></i></div><p class="sub">Q${qi+1} / ${QS.length}</p><h2>${q.q}</h2>${q.o.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join('')}</div>`;
 $('v').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{tally[q.o[b.dataset.i][1]]++;qi++;
  if(qi>=QS.length){const sc=MOVIES.map(m=>[m,Object.keys(tally).reduce((s,k)=>s+tally[k]*(m.v[k]||0),0)+Math.random()*.5]).sort((x,y)=>y[1]-x[1]);res=[sc[0][0],sc[1][0]];var w=!S.quiz&&cnt()>=3;S.quiz=true;save()}render();if(w)thanks(true)})}
function vRev(){
 const d=draft;
 $('v').innerHTML=`<div class="card"><h2>観た映画の感想を残そう</h2>
 <label class="sub">映画</label><select id="m">${MOVIES.map((m,i)=>`<option value="${i}" ${d.m==i?'selected':''}>${esc(m.n)}</option>`).join('')}</select>
 <label class="sub">評価</label><div class="stars" id="st">${[1,2,3,4,5].map(i=>`<button data-i="${i}" class="${d.s>=i?'on':''}" aria-label="${i}">${I('star')}</button>`).join('')}</div>
 <label class="sub">この映画を一言で表すと？</label><div class="emo" id="em">${EMO.map(e=>`<button data-e="${e[0]}" class="${d.e===e[0]?'on':''}">${I(e[0])}<span>${e[1]}</span></button>`).join('')}</div>
 <label class="sub">ひとこと感想</label><textarea id="t" rows="3" maxlength="120" placeholder="120字まで">${esc(d.t)}</textarea>
 <label class="sub">ニックネーム（任意）</label><input id="nm" maxlength="12" value="${esc(d.nm)}">
 ${API&&NP?`<label class="sub">合言葉（会場で伝えます）</label><input id="pc" autocomplete="off" autocapitalize="off" maxlength="30" value="${esc(S.pc||'')}"><p class="cm">合言葉は、会場に来た人にだけ伝えています。</p>`:''}<p class="cm">${I('info')} 投稿した感想とニックネームは、来場者のみなさんに公開されます。個人情報は書かないでください。</p><button class="btn" id="ok">${I('send')} 投稿する</button> <span id="msg" class="cm"></span></div>`;
 $('m').onchange=e=>d.m=+e.target.value;$('t').oninput=e=>d.t=e.target.value;$('nm').oninput=e=>d.nm=e.target.value;
 $('st').querySelectorAll('button').forEach(b=>b.onclick=()=>{d.s=+b.dataset.i;render()});
 $('em').querySelectorAll('button').forEach(b=>b.onclick=()=>{d.e=b.dataset.e;render()});
 $('ok').onclick=async()=>{
  const msg=t=>{$('msg').textContent=t};
  if(!d.s){msg('星を選んでね');return}
  const rr={id:uid(),sy:0,m:MOVIES[d.m].n,s:d.s,e:d.e,t:d.t.trim(),nm:d.nm.trim()||'匿名',at:Date.now(),sid:sid()};
  if(API&&NP){
   const pc=($('pc')||{value:''}).value.trim();
   if(!pc){msg('合言葉を入れてください（会場で伝えます）');return}
   $('ok').disabled=true;msg('送信中…');
   S.pc=pc;const x=await post(rr,pc);
   if($('ok'))$('ok').disabled=false;
   if(x==='pass'){S.pc='';save();msg('合言葉が違います。会場のスタッフに聞いてください。');return}
   if(x==='busy'){msg('混み合っています。少し待って、もう一度押してください。');return}
   if(x==='ok')rr.sy=1;
  }
  S.reviews.push(rr);save();if(!rr.sy&&API)flush();
  draft={m:d.m,s:0,e:'',t:'',nm:''};tab='stamp';render();thanks(S.quiz&&cnt()===3&&S.reviews.filter(r=>r.sid===sid()&&r.m===MOVIES[d.m].n).length===1)}}
function sid(){return S.sid||(S.sid=1),S.sid}
const API=(()=>{const u=((document.querySelector('meta[name="api-url"]')||{}).content||'').trim();return /^https:\/\/script\.google\.com\/(?:a\/macros\/[A-Za-z0-9.\-]+|macros)\/s\/[A-Za-z0-9_-]+\/exec$/.test(u)?u:''})();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
if(!S.dev)S.dev=uid();
S.reviews.forEach(r=>{if(!r.id){r.id=uid();r.sy=1}});save();
let NP=true,R=[],SYN=API?'読み込み中…':'共有は未設定です（この端末の中だけに保存されます）';
const ALL=()=>{const ids=new Set(R.map(r=>r.id));return R.concat(S.reviews.filter(r=>!ids.has(r.id))).sort((a,b)=>a.at-b.at)};
let FL=0;
async function post(r,pc){
 try{
  const res=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({id:r.id,m:r.m,s:r.s,e:r.e,nm:r.nm,t:r.t,dv:S.dev,pc:pc||''}),credentials:'omit',referrerPolicy:'no-referrer'});
  const j=await res.json();
  if(j.ok)return 'ok';
  return j.error==='pass'?'pass':(j.error==='busy'?'busy':'err');
 }catch(e){return 'err'}
}
async function flush(){
 if(!API||FL)return;FL=1;
 try{
  for(const r of S.reviews.filter(x=>!x.sy)){
   const x=await post(r,S.pc);
   if(x==='ok'){r.sy=1;save()}else break;
  }
 }finally{FL=0}
 await loadRemote();
}
async function loadRemote(){
 if(!API)return;
 try{
  const res=await fetch(API+'?action=list&_='+Date.now(),{credentials:'omit',referrerPolicy:'no-referrer'});
  const j=await res.json();
  if(j.ok){NP=!!j.pass;R=(Array.isArray(j.reviews)?j.reviews:[]).map(r=>({id:String(r.id),at:+r.at||0,m:String(r.m),s:Math.min(5,Math.max(0,Math.round(+r.s)||0)),e:String(r.e),nm:String(r.nm).replace(/^'(?=[=+\-@])/,''),t:String(r.t).replace(/^'(?=[=+\-@])/,'')}));SYN='最新の感想を表示中（'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+' 更新）'}
 }catch(e){SYN='読み込めませんでした。通信を確認して「更新」を押してください。'}
 if(tab==='rank')render();
}
let rv='new',onlyRev=false;
const pk=i=>Object.keys(PR).find(k=>PR[k].f.includes(i));
const stars=n=>`<span class="stv">${[1,2,3,4,5].map(i=>`<span class="${i<=Math.round(n)?'':'off'}">${I('star')}</span>`).join('')}</span>`;
const by_=n=>ALL().filter(r=>r.m===n);
const avg=a=>a.reduce((x,r)=>x+r.s,0)/a.length;
const md=t=>{const d=new Date(t);return (d.getMonth()+1)+'/'+d.getDate()};
const pill=i=>`<span class="pill" style="--pc:${PR[pk(i)].c}">${PR[pk(i)].n}</span>`;
const head=(i,x)=>`<div class="mh"><div>${pill(i)}<div class="mt">${esc(MOVIES[i].n)}</div><div class="cm">${esc(MOVIES[i].by)}・${dm(MOVIES[i].m)}</div></div>${x||''}</div>`;
const sc=a=>`<div class="sc">${stars(avg(a))}<span class="cm">${a.length}件</span></div>`;
const celeb=()=>`<div class="cel"><p class="ct2">たくさんの感想をありがとうございます！<br>あなたはもうViCCメンバーの一員です！！</p><img alt="" src="${FR2[0]}"></div>`;
let LT=0,LI=0;
function startLoop(){clearInterval(LT);if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 LT=setInterval(()=>{const L=document.querySelectorAll('.cel img');if(!L.length){clearInterval(LT);return}LI=(LI+1)%FR2.length;L.forEach(im=>im.src=FR2[LI])},140)}
const cnt=()=>new Set(S.reviews.filter(r=>r.sid===sid()).map(r=>r.m)).size;
const nc=r=>{const i=MOVIES.findIndex(m=>m.n===r.m),k=pk(i);if(i<0)return '';return `<div class="fc" style="--pc:${PR[k].c}"><div class="fh">${head(i,'')}</div><div class="fb"><div class="rt">${stars(r.s)}${EL[r.e]?`<span class="rx">${I(r.e)} ${EL[r.e]}</span>`:''}</div>${r.t?`<p class="ct">${esc(r.t)}</p>`:''}<div class="cm">${esc(r.nm)}・${md(r.at)}</div></div></div>`};
function vRank(){
 let h=`<div class="syn"><span class="cm">${SYN}</span>${API?`<button class="btn g sm" id="rf">${I('refresh-cw')} 更新</button>`:''}</div><div class="tg" style="margin-bottom:12px"><button class="${rv==='new'?'on':''}" data-v="new">${I('message-circle')} 新着コメント</button><button class="${rv==='by'?'on':''}" data-v="by">${I('layout-list')} 作品ごと</button></div>`;
 if(rv==='new'){
  const L=ALL().filter(r=>r.t||EL[r.e]).slice().sort((a,b)=>b.at-a.at).slice(0,10);
  h+=L.length?L.map(nc).join(''):`<div class="card"><p class="cm">まだコメントがありません。最初のコメントを書いてみよう！</p><button class="btn sm" data-g="rev">${I('pen-line')} 感想を書く</button></div>`;
  const rk=MOVIES.map((m,i)=>[i,by_(m.n)]).filter(x=>x[1].length).sort((a,b)=>avg(b[1])-avg(a[1])||b[1].length-a[1].length).slice(0,5);
  if(rk.length)h+=`<div class="card tp"><h3>${I('trophy')} ランキングTOP5</h3>${rk.map((r,n)=>`<div class="rk"><span class="rn2">${n+1}</span><span class="rk-t">${esc(MOVIES[r[0]].n)}</span><span class="cm">${I('star')} ${avg(r[1]).toFixed(1)}（${r[1].length}件）</span></div>`).join('')}</div>`;
 }else{
  h+=`<button class="btn g sm" id="of" style="margin-bottom:6px">${I(onlyRev?'eye':'filter')} ${onlyRev?'すべての作品を表示':'感想がある作品だけ表示'}</button>`;
  Object.keys(PR).forEach(k=>{
   const L=PR[k].f.filter(i=>!onlyRev||by_(MOVIES[i].n).length);if(!L.length)return;
   h+=`<h3 class="gh" style="--pc:${PR[k].c}"><span class="chip">${I(PR[k].e)}</span>${PR[k].n}</h3>`;
   L.forEach(i=>{const a=by_(MOVIES[i].n).slice().reverse();
    h+=`<div class="fc" style="--pc:${PR[k].c}"><div class="fh">${head(i,a.length?sc(a):'')}</div><div class="fb">${a.length?a.map(r=>`<div class="rv"><div class="rt">${stars(r.s)}${EL[r.e]?`<span class="rx">${I(r.e)} ${EL[r.e]}</span>`:''}</div>${r.t?`<p>${esc(r.t)}</p>`:''}<div class="cm">${esc(r.nm)}・${md(r.at)}</div></div>`).join(''):`<p class="cm em">まだ感想が投稿されてません‥。あなたの感想をぜひ聞かせてください！</p>`}<button class="btn g sm" data-w="${i}">${I('pen-line')} この作品の感想を書く</button></div></div>`})});
  if(onlyRev&&!ALL().length)h+=`<div class="card"><p class="cm">まだ感想がありません。最初の投稿者になろう！</p></div>`;
 }
 $('v').innerHTML=h;
 $('v').querySelectorAll('.tg button').forEach(b=>b.onclick=()=>{rv=b.dataset.v;render()});
 if($('rf'))$('rf').onclick=loadRemote;
 if($('of'))$('of').onclick=()=>{onlyRev=!onlyRev;render()};
 $('v').querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{draft.m=+b.dataset.w;tab='rev';render()});
 $('v').querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{tab=b.dataset.g;render()});}
function vStamp(){
 const n=new Set(S.reviews.filter(r=>r.sid===sid()).map(r=>r.m)).size;
 const st=[[S.quiz,'compass','診断'],[n>=1,'pen-line','感想1'],[n>=2,'pen-line','感想2'],[n>=3,'pen-line','感想3']];
 const all=st.every(s=>s[0]);
 $('v').innerHTML=`<div class="card"><h2>スタンプカード</h2><div class="stamps">${st.map(s=>`<div class="st ${s[0]?'on':''}">${I(s[0]?s[1]:'lock')}<small>${s[2]}</small></div>`).join('')}</div>
 ${all?`${celeb()}`:`<p class="sub" style="text-align:center">診断を1回して、別々の作品の感想を3つ書くとコンプリート！<br>（診断 ${S.quiz?1:0} / 1・感想 ${Math.min(n,3)} / 3）</p>`}</div>
 <button class="btn g" id="nx">${I('users')} 次の人へ（スタンプをリセット）</button>`;
 $('nx').onclick=()=>{if(confirm('スタンプと診断結果をリセットします。感想データは残ります。')){S.quiz=false;S.sid=(S.sid||1)+1;save();res=null;qi=0;tally={h:0,d:0,w:0,f:0};ok=false;tab='sch';render()}}}
render();flush();setInterval(()=>{S.reviews.some(x=>!x.sy)?flush():(tab==='rank'&&loadRemote())},30000);
</script>
